services:
  # Windows (NVIDIA GPU via WSL2 Docker Desktop):
  #   docker compose -f .agents/skills/roblox-gpu-model/containers/docker-compose.yml --profile cuda up -d --build
  roblox-gpu-model-cuda:
    profiles: ["cuda"]
    build:
      context: .
      dockerfile: Dockerfile.cuda
    image: roblox-gpu-model-server:cuda
    container_name: roblox-gpu-model-cuda
    ports:
      - "127.0.0.1:8085:8085"
    volumes:
      - ../../../../work:/workspace/work
      - ../../../../assets:/workspace/assets
      - ../../../../.tools/roblox-gpu-model/hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
